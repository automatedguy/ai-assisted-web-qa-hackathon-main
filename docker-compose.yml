services:
  site-under-test:
    build: ./site-under-test
    ports:
      - "127.0.0.1:${PRACTICE_SITE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [qa-net]

  qa-platform:
    build: ./platform-template
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    init: true
    depends_on:
      site-under-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      SITE_URL: http://site-under-test
      LINGUISTIC_ASSET_PATH: /data/linguistic-assets/practice-profile.yaml
      ISSUE_SCHEMA_PATH: /data/docs/ISSUE_SCHEMA.json
      REFERENCE_CONTENT_PATH: /data/reference-content
      QA_DATA_DIR: /var/lib/qa-platform
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-}
      OPENAI_CACHED_INPUT_USD_PER_MILLION: ${OPENAI_CACHED_INPUT_USD_PER_MILLION:-}
      OPENAI_CACHE_WRITE_USD_PER_MILLION: ${OPENAI_CACHE_WRITE_USD_PER_MILLION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    volumes:
      - qa-history:/var/lib/qa-platform
      - ./linguistic-assets:/data/linguistic-assets:ro
      - ./reference-content:/data/reference-content:ro
      - ./docs:/data/docs:ro
    networks: [qa-net]

networks:
  qa-net: {}

volumes:
  qa-history: {}
