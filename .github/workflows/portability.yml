name: Installation and portability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: platform-template/package-lock.json
      - run: npm run setup -- --with-deps
      - run: npm --prefix platform-template run typecheck
      - run: npm test
      - run: npm run test:install
      - run: npm --prefix platform-template run test:catalog-browser
      - run: npm --prefix platform-template run test:configuration-ui
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/docker-smoke.mjs
